<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מגרש הגמרים — כדורגל וכדורסל</title>
<meta name="description" content="שאלו כל שאלה על גמרי ליגת האלופות וגמרי ה-NBA וקבלו תשובה מבוססת על נתוני הגמרים ההיסטוריים" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Heebo:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="sport-all" data-sport="">
  <div class="pitch-frame">
    <!-- football pitch markings: goalkeeper area (penalty box + goal box + arc) at each end
         (the halfway line lives on the query box itself) -->
    <svg class="court-lines lines-football" viewBox="0 0 300 500" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="2">
        <path d="M25 2 V82 H275 V2" />
        <rect x="100" y="2" width="100" height="30" />
        <path d="M94 82 A60 60 0 0 0 206 82" />
        <path d="M25 498 V418 H275 V498" />
        <rect x="100" y="468" width="100" height="30" />
        <path d="M94 418 A60 60 0 0 1 206 418" />
      </g>
    </svg>

    <!-- basketball court markings, drawn to real NBA proportions at a uniform 5.3 units/ft scale
         (16ft key over 19ft, 12ft free-throw circle, 4ft restricted arc, 23.75ft/22ft three-point line)
         so circles stay circles and the halfway line lives on the query box itself -->
    <svg class="court-lines lines-basketball" viewBox="0 0 300 500" aria-hidden="true" focusable="false">
      <path d="M-15 2 A165 165 0 0 0 315 2 Z" fill="var(--two-point-fill)" stroke="none" />
      <path d="M98 2 V102.7 H202 V2 Z" fill="var(--key-fill)" stroke="none" />
      <path d="M112 102.7 A38 38 0 0 1 188 102.7 Z" fill="var(--two-point-fill)" stroke="none" />
      <path d="M112 102.7 A38 38 0 0 0 188 102.7 Z" fill="var(--key-fill)" stroke="none" />
      <path d="M-15 498 A165 165 0 0 1 315 498 Z" fill="var(--two-point-fill)" stroke="none" />
      <path d="M98 498 V397.3 H202 V498 Z" fill="var(--key-fill)" stroke="none" />
      <path d="M112 397.3 A38 38 0 0 0 188 397.3 Z" fill="var(--two-point-fill)" stroke="none" />
      <path d="M112 397.3 A38 38 0 0 1 188 397.3 Z" fill="var(--key-fill)" stroke="none" />
      <g fill="none" stroke="currentColor" stroke-width="2">
        <path d="M98 2 V102.7 H202 V2" />
        <circle cx="150" cy="102.7" r="38" />
        <path d="M-15 2 A165 165 0 0 0 315 2" />
        <path d="M98 498 V397.3 H202 V498" />
        <circle cx="150" cy="397.3" r="38" />
        <path d="M-15 498 A165 165 0 0 1 315 498" />
      </g>
    </svg>

    <header class="pitch-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="12" cy="12" r="9.3" />
          <path d="M12 6.3l3.3 2.4-1.3 3.9H10l-1.3-3.9z" />
          <path d="M12 6.3V2.6M15.3 8.7l3.5-1.2M14 12.6l2.7 2.9M10 12.6l-2.7 2.9M8.7 8.7L5.2 7.5" />
        </svg>
        <div class="brand-text">
          <p class="brand-eyebrow">Finals History</p>
          <h1 class="brand-title">מגרש הגמרים</h1>
        </div>
      </div>

      <nav class="sport-tabs" role="tablist" aria-label="בחירת ענף ספורט">
        <button class="sport-tab" data-sport="" role="tab" aria-selected="true" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2" />
            <line x1="12" y1="4.5" x2="12" y2="19.5" />
          </svg>
          הכל
        </button>
        <button class="sport-tab" data-sport="football" role="tab" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <circle cx="12" cy="12" r="9.3" />
            <path d="M12 6.3l3.3 2.4-1.3 3.9H10l-1.3-3.9z" />
          </svg>
          כדורגל
        </button>
        <button class="sport-tab" data-sport="basketball" role="tab" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <circle cx="12" cy="12" r="9.3" />
            <path d="M12 2.7v18.6M2.7 12h18.6M4.9 5.6a13 13 0 0 1 14.2 0M4.9 18.4a13 13 0 0 0 14.2 0" />
          </svg>
          כדורסל
        </button>
      </nav>
    </header>

    <div class="halfway-line" aria-hidden="true"></div>

    <main class="pitch-main">
      <p class="tagline">שאלו כל שאלה על גמרי ליגת האלופות וגמרי ה-NBA, וקבלו תשובה מבוססת על נתוני הגמרים ההיסטוריים</p>

      <form class="center-circle-form" id="ask-form" novalidate>
        <div class="pitch-centerline" aria-hidden="true"></div>
        <div class="center-circle-ring" aria-hidden="true"></div>
        <label class="sr-only" for="question">השאלה שלכם</label>
        <textarea id="question" name="question" placeholder="מה תרצו לדעת?" rows="2" required></textarea>
        <button type="submit" class="whistle-btn" aria-label="שריקת פתיחה — שלחו שאלה">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 11h3.2" />
            <path d="M6 9.3h7a4.2 4.2 0 1 1 0 5.4H6z" />
            <circle cx="14.7" cy="12" r="1.3" fill="currentColor" stroke="none" />
            <path d="M17.6 9.4a3.7 3.7 0 0 1 0 5.2" />
            <path d="M20 8.4a5.6 5.6 0 0 1 0 7.2" opacity=".55" />
          </svg>
        </button>
      </form>

      <div class="loading-strip" id="loading" hidden>
        <span class="loading-ball" aria-hidden="true"></span>
        <span class="loading-text">הכדור באוויר...</span>
      </div>

      <section class="ruling-box" id="answer-section" hidden aria-live="polite">
        <h2 class="ruling-heading">התוצאה הרשמית</h2>
        <p class="ruling-text" id="answer-text"></p>
      </section>

      <section class="sources-board" id="sources-section" hidden>
        <h2 class="sources-heading">מקורות מהגמר</h2>
        <div class="sub-tiles" id="sources-list"></div>
      </section>

      <p class="empty-state" id="empty-state" hidden>הפרט הזה לא נמצא במאגר הגמרים שלנו. נסו לנסח את השאלה אחרת.</p>
      <p class="error-state" id="error-state" hidden>יש בעיה בקו — נסו שוב עוד רגע.</p>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
